<div class="flex h-screen bg-[#f9fafb] md:p-4 md:gap-4 relative overflow-hidden">
  <!-- Mobile Backdrop -->
  <div *ngIf="isSidebarOpen" class="md:hidden fixed inset-0 bg-gray-900/50 z-40" (click)="isSidebarOpen = false"></div>

  <!-- Floating Sidebar -->
  <aside 
    [class.w-64]="isSidebarOpen" 
    [class.w-0]="!isSidebarOpen"
    [class.md:w-64]="isSidebarOpen"
    [class.md:w-20]="!isSidebarOpen"
    class="fixed md:relative z-50 h-full md:h-auto bg-white border-r md:border border-gray-200 md:rounded-3xl shadow-2xl md:shadow-sm flex flex-col transition-all duration-300 overflow-hidden"
  >
    <!-- Logo -->
    <div class="p-8 flex justify-center items-center gap-2" [class.px-0]="!isSidebarOpen">
      <h1 class="text-3xl font-black tracking-tighter whitespace-nowrap" *ngIf="isSidebarOpen || !isSidebarOpen">
        {{ isSidebarOpen ? 'KODA' : 'K' }}<span class="text-[#3B82F6]">.</span>
      </h1>
      <button class="md:hidden ml-auto p-2" (click)="isSidebarOpen = false" *ngIf="isSidebarOpen">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" /></svg>
      </button>
    </div>

    <!-- Navigation -->
    <nav class="flex-1 px-3 space-y-2 overflow-y-auto">
      <a 
        *ngFor="let item of menuItems" 
        [routerLink]="item.route" 
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: item.exact }"
        class="sidebar-link group"
        [class.justify-center]="!isSidebarOpen"
      >
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 shrink-0 opacity-70 group-[.active]:opacity-100" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" [attr.d]="item.icon" />
        </svg>
        <span *ngIf="isSidebarOpen" class="text-sm tracking-tight whitespace-nowrap">{{ item.label }}</span>
      </a>
    </nav>

    <!-- User Profile -->
    <div class="p-4 border-t border-gray-100" [class.px-2]="!isSidebarOpen">
      <div 
        routerLink="/settings"
        class="flex items-center gap-3 p-2 rounded-xl hover:bg-gray-50 cursor-pointer transition-colors"
        [class.justify-center]="!isSidebarOpen"
        [class.px-0]="!isSidebarOpen"
      >
        <div class="w-10 h-10 bg-blue-100 rounded-full flex items-center justify-center text-[var(--color-primary)] font-bold shrink-0">
          {{ user?.full_name?.charAt(0) }}
        </div>
        <div *ngIf="isSidebarOpen" class="flex-1 min-w-0">
          <p class="text-sm font-bold text-gray-900 truncate">{{ user?.full_name }}</p>
          <p class="text-xs text-gray-500 truncate">Administrator</p>
        </div>
        <button *ngIf="isSidebarOpen" (click)="logout()" class="p-2 text-gray-400 hover:text-red-500 transition-colors shrink-0">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
          </svg>
        </button>
      </div>
    </div>
  </aside>

  <!-- Main Content Area -->
  <div class="flex-1 flex flex-col md:gap-4 overflow-hidden w-full">
    <!-- Top Header -->
    <header class="h-16 bg-white border-b md:border border-gray-200 md:rounded-2xl shadow-xs px-4 md:px-6 flex items-center justify-between shrink-0">
      <div class="flex items-center gap-4">
        <button (click)="isSidebarOpen = !isSidebarOpen" class="p-2 hover:bg-gray-100 rounded-lg text-gray-500">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16m-7 6h7" />
          </svg>
        </button>
        <h2 class="text-sm font-bold text-gray-400 uppercase tracking-widest">ERP Management System</h2>
      </div>
      
      <div class="flex items-center gap-4">
        <!-- Notification Bell -->
        <div class="relative">
          <button (click)="toggleNotifDropdown($event)" class="p-2 hover:bg-gray-100 rounded-lg text-gray-500 relative">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9" />
            </svg>
            <span *ngIf="unreadCount > 0" class="absolute top-2 right-2 w-4 h-4 bg-red-500 text-white text-[10px] font-black rounded-full flex items-center justify-center border-2 border-white">
              {{ unreadCount }}
            </span>
          </button>

          <!-- Notification Dropdown -->
          <div *ngIf="showNotifDropdown" class="absolute right-0 mt-2 w-80 bg-white border border-gray-100 rounded-[2rem] shadow-2xl z-[100] animate-in fade-in zoom-in-95 duration-200 overflow-hidden">
            <div class="p-5 border-b border-gray-50 flex justify-between items-center bg-gray-50/50">
              <h3 class="text-xs font-black text-gray-900 uppercase tracking-widest">Notifications</h3>
              <button (click)="markAllRead()" class="text-[9px] font-black text-blue-600 uppercase hover:underline">Tout lire</button>
            </div>
            
            <div class="max-h-96 overflow-y-auto custom-scrollbar">
              <div *ngFor="let n of notifications" 
                   (click)="markAsRead(n)"
                   [class.bg-blue-50]="!n.is_read"
                   class="p-5 border-b border-gray-50 hover:bg-gray-50 cursor-pointer transition-colors group">
                <div class="flex gap-4">
                  <div class="w-10 h-10 rounded-2xl flex items-center justify-center shrink-0" 
                       [class.bg-blue-100]="n.type === 'Project'"
                       [class.bg-orange-100]="n.type === 'Task'"
                       [class.bg-red-100]="n.type === 'Incident'"
                       [class.text-blue-600]="n.type === 'Project'"
                       [class.text-orange-600]="n.type === 'Task'"
                       [class.text-red-600]="n.type === 'Incident'">
                    <svg *ngIf="n.type === 'Project'" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 002-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10" /></svg>
                    <svg *ngIf="n.type === 'Task'" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4" /></svg>
                    <svg *ngIf="n.type === 'Incident'" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" /></svg>
                  </div>
                  <div class="flex-1 min-w-0">
                    <h4 class="text-xs font-black text-gray-900 mb-1">{{ n.title }}</h4>
                    <p class="text-[11px] text-gray-500 leading-relaxed">{{ n.message }}</p>
                    <p class="text-[9px] text-gray-400 mt-2 font-bold">{{ n.created_at | date:'shortTime' }}</p>
                  </div>
                </div>
              </div>
              
              <div *ngIf="notifications.length === 0" class="p-10 text-center text-gray-400">
                <p class="text-[10px] font-black uppercase tracking-[0.2em]">Aucune notification</p>
              </div>
            </div>
          </div>
        </div>

        <div class="hidden md:flex items-center bg-gray-100 px-4 py-2 rounded-xl text-gray-400 text-sm w-64 border border-transparent focus-within:border-blue-300 focus-within:bg-white transition-all">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
          </svg>
          Search...
        </div>
      </div>
    </header>

    <!-- Page Content -->
    <main class="flex-1 bg-white md:border border-gray-200 md:rounded-3xl shadow-sm overflow-y-auto p-4 md:p-8 relative">
       <router-outlet></router-outlet>
    </main>
  </div>
</div>
