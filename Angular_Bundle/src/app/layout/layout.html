<div class="flex h-screen bg-[#f9fafb] p-4 gap-4">
  <!-- Floating Sidebar -->
  <aside 
    [class.w-64]="isSidebarOpen" 
    [class.w-20]="!isSidebarOpen"
    class="bg-white border border-gray-200 rounded-3xl shadow-sm flex flex-col transition-all duration-300 overflow-hidden"
  >
    <!-- Logo -->
    <div class="p-8">
      <h1 class="text-3xl font-black tracking-tighter whitespace-nowrap">KODA<span class="text-[#d97706]">.</span></h1>
    </div>

    <!-- Navigation -->
    <nav class="flex-1 px-4 space-y-2 overflow-y-auto">
      <a 
        *ngFor="let item of menuItems" 
        [routerLink]="item.route" 
        routerLinkActive="active"
        class="sidebar-link group"
      >
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 shrink-0 opacity-70 group-[.active]:opacity-100" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" [attr.d]="item.icon" />
        </svg>
        <span *ngIf="isSidebarOpen" class="text-sm tracking-tight whitespace-nowrap">{{ item.label }}</span>
      </a>
    </nav>

    <!-- User Section -->
    <div class="p-3 border-t border-gray-100">
      <div class="flex items-center gap-3 p-3 bg-gray-50 rounded-2xl">
        <div class="w-10 h-10 rounded-xl bg-gray-200 flex items-center justify-center font-bold text-gray-500 shrink-0">
          {{ user?.username?.charAt(0).toUpperCase() }}
        </div>
        <div *ngIf="isSidebarOpen" class="flex-1 min-w-0">
          <p class="text-sm font-bold truncate">{{ user?.full_name }}</p>
          <p class="text-[10px] text-gray-500 uppercase tracking-widest font-bold">{{ user?.is_global_admin ? 'Admin' : 'Developer' }}</p>
        </div>
        <button (click)="logout()" *ngIf="isSidebarOpen" class="text-gray-400 hover:text-red-500 transition-colors">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
          </svg>
        </button>
      </div>
    </div>
  </aside>

  <!-- Main Content Area -->
  <div class="flex-1 flex flex-col gap-4 overflow-hidden">
    <!-- Top Header -->
    <header class="h-16 bg-white border border-gray-200 rounded-2xl shadow-xs px-6 flex items-center justify-between">
      <div class="flex items-center gap-4">
        <button (click)="isSidebarOpen = !isSidebarOpen" class="p-2 hover:bg-gray-100 rounded-lg text-gray-500">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16m-7 6h7" />
          </svg>
        </button>
        <h2 class="text-sm font-bold text-gray-400 uppercase tracking-widest">ERP Management System</h2>
      </div>
      
      <div class="flex items-center gap-4">
        <!-- Search Placeholder -->
        <div class="hidden md:flex items-center bg-gray-100 px-4 py-2 rounded-xl text-gray-400 text-sm w-64 border border-transparent focus-within:border-orange-300 focus-within:bg-white transition-all">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
          </svg>
          Search...
        </div>
      </div>
    </header>

    <!-- Page Content -->
    <main class="flex-1 bg-white border border-gray-200 rounded-3xl shadow-sm overflow-y-auto p-8 relative">
       <router-outlet></router-outlet>
    </main>
  </div>
</div>
